name: Bug report
description: Report reproducible behavior using synthetic or redacted data
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not attach a real vault, API key, state database, or private provider output.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install or packaging
        - Indexing
        - Local search
        - Candidate suggestions
        - Jev relationship evaluation
        - Jev search reranking
        - Review log
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: secondbrain 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.12
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest command sequence and fictional fixture that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact local paths, note content, keys, and provider identifiers that are not needed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic or redacted data and included no credentials or private note content.
          required: true
