[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-second-brain"
version = "0.1.0"
description = "Local-first memory alignment and source-linked search with optional Jev judgments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Max F. Findel" }]
keywords = ["memory", "obsidian", "markdown", "search", "jev"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
secondbrain = "jev_second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
